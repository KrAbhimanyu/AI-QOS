[project]
name = "ai-qos"
version = "1.0.0"
description = "AI Quality of Service - Agent Control Tower"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "streamlit-extras>=0.4.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[tool.streamlit]
navigation.max_indent = 2

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
